<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="CodeHim">
  <title>Prototipo</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css'>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
  <img src="/assets/ganador.png" alt="imagen-ganador">
  <main>
    <div class="container">
      <div class="row pt-4">
        <div class="col-md-6">
          <p class="name">Pagos</p>
          <div class="fount-margin">
            <p>
              <span id="count1"></span>
            </p>
          </div>
        </div>
        <div class="col-md-6 center-paraf">
          <p class="name">Recarga</p>
          <div class="fount-margin">
            <p>
              <span id="count2"></span>
            </p>
          </div>
        </div>
      </div>
      <div class="row margin-two">
        <div class="col-6 ">
          <p class="name">Paquete</p>
          <div class="fount-margin">
            <p>
              <span id="count3"></span>
            </p>
          </div>
        </div>
        <div class="col-md-6 center-paraf">
          <p class="name">Giro</p>
          <div class="fount-margin">
            <p>
              <span id="count4"></span>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Button to Open the Modal -->
    <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">
      modal
    </button>

    <!-- The Modal -->
    <div class="modal" id="myModal">
      <div class="img-winner" data-dismiss="modal">
        <img src="/assets/winne.png" alt="ganador">
      </div>
    </div>

    
  </main>

  <script src="./js/script.js"></script>

</body>

</html>
